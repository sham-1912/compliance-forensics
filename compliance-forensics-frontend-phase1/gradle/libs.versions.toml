[versions]
agp = "9.3.1"
coreKtx = "1.13.1"
kotlin = "1.9.24"
room = "2.7.2"
permissionx = "1.8.0"
lifecycle = "2.8.4"
retrofit = "2.11.0"
okhttp = "4.12.0"
constraintlayout = "2.1.4"
mockito = "5.11.0"
